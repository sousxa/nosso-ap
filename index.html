      --text-muted: #71717a;
      --accent-indigo: #6366f1;
      --accent-indigo-light: #818cf8;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;

    [data-theme="light"] {

      background: var(--bg-primary);

      border: 2px solid var(--bg-secondary);

    const { useState, useEffect, useCallback, useMemo } = React;

    // ========================
    // UTILIDADES
    // ========================
    const fmt = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const fmtNum = (v, d = 0) => v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });

    function calcSaldoEntrega(saldo, inccAnual, meses) {
      const mensal = Math.pow(1 + inccAnual / 100, 1 / 12) - 1;
      return saldo * Math.pow(1 + mensal, meses);
    }

    // PRICE: parcela fixa = saldo * [i*(1+i)^n] / [(1+i)^n - 1]
    function calcParcelaPRICE(saldo, taxaAnual, prazoMeses) {
      const i = Math.pow(1 + taxaAnual / 100, 1 / 12) - 1;
      if (i === 0) return saldo / prazoMeses;
      const fator = Math.pow(1 + i, prazoMeses);
      return saldo * (i * fator) / (fator - 1);
    }

    function calcTotalJurosPRICE(saldo, taxaAnual, prazoMeses) {
      const parcela = calcParcelaPRICE(saldo, taxaAnual, prazoMeses);
      return (parcela * prazoMeses) - saldo;
    }

    // Taxa de obra (juros de interveniencia)
    // O banco libera $ pra construtora conforme obra avanca.
    // Comprador paga juros sobre o valor ja liberado.
    // Modelo simplificado: progressao linear do % liberado.
    function calcTaxaObraTotal(saldo, taxaAnual, mesesRestantes, percentualAtual) {
      const iMensal = Math.pow(1 + taxaAnual / 100, 1 / 12) - 1;
      let total = 0;
      const percAtual = percentualAtual / 100;
      for (let m = 0; m < mesesRestantes; m++) {
        // % liberado cresce linearmente de percAtual ate 100%
        const percMes = percAtual + ((1 - percAtual) * (m / Math.max(mesesRestantes, 1)));
        total += saldo * percMes * iMensal;
      }
      return total;
    }

    function calcTaxaObraMensal(saldo, taxaAnual, percentualObra) {
      const iMensal = Math.pow(1 + taxaAnual / 100, 1 / 12) - 1;
      return saldo * (percentualObra / 100) * iMensal;
    }

    function diffMeses(from, to) {
      const d = new Date();
      const months = (to.getFullYear() - d.getFullYear()) * 12 + (to.getMonth() - d.getMonth());
      return Math.max(0, months);
    }

    function diffDias(to) {
      const now = new Date();
      const diff = to - now;
      return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    function progresso(entrega, mesesObra) {
      const now = new Date();
      const inicio = new Date(entrega);
      inicio.setMonth(inicio.getMonth() - mesesObra);
      const total = entrega - inicio;
      const elapsed = now - inicio;
      return Math.min(100, Math.max(0, (elapsed / total) * 100));
    }

    // ========================
    // COMPONENTE: LOGIN
    // ========================
    function LoginScreen({ onLogin }) {
      const [senha, setSenha] = useState("");
      const [erro, setErro] = useState(false);
      const [shake, setShake] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (senha === "joao2026") {
          sessionStorage.setItem("meuap_auth", "1");
          onLogin();
        } else {
          setErro(true);
          setShake(true);
          setTimeout(() => setShake(false), 500);
        }
      };

      return (
        <div style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: "var(--bg-primary)",
          padding: "20px",

            borderRadius: "16px",

            </div>
            <h1 style={{ fontSize: "28px", fontWeight: 700, marginBottom: 8 }}>Meu AP</h1>
            <p style={{ color: "var(--text-muted)", marginBottom: 32, fontSize: 14 }}>
              Planejamento financeiro imobiliario
            </p>
            <form onSubmit={handleSubmit}>
              <div style={{ position: "relative", marginBottom: 16 }}>
                <input
                  type="password"
                  value={senha}
                  onChange={(e) => { setSenha(e.target.value); setErro(false); }}

                  style={{
                    width: "100%",
                    padding: "14px 16px",
                    background: "var(--bg-tertiary)",
                    border: `1px solid ${erro ? "var(--accent-red)" : "var(--border)"}`,
                    borderRadius: "var(--radius-sm)",
                    color: "var(--text-primary)",
                    fontSize: 16,
                    outline: "none",
                    fontFamily: "inherit",
                    transition: "border 0.2s",
                  }}
                  autoFocus
                />
              </div>
              {erro && (

                  Senha incorreta. Tente novamente.

              25% { transform: translateX(-8px); }
              75% { transform: translateX(8px); }

    }

    // ========================
    // COMPONENTE: CARD DO AP
    // ========================
    function ApartmentCard({ ap, params }) {
      const saldoEntrega = calcSaldoEntrega(ap.financiamento, params.incc, ap.mesesObra);
      const prazoMeses = params.prazoAnos * 12;
      const taxaTotal = params.taxaJuros + params.tr * 12;
      const parcelaPRICE = calcParcelaPRICE(saldoEntrega, taxaTotal, prazoMeses);
      const mesesRestantes = diffMeses(new Date(), ap.entrega);
      const taxaObraMensal = calcTaxaObraMensal(ap.financiamento, params.taxaJuros, ap.percentualObra);
      const taxaObraTotal = calcTaxaObraTotal(ap.financiamento, params.taxaJuros, mesesRestantes, ap.percentualObra);
      const dias = diffDias(ap.entrega);
      const meses = mesesRestantes;
      const prog = progresso(ap.entrega, ap.mesesObra);
      const corVar = ap.cor === "indigo" ? "var(--accent-indigo)" : "var(--accent-amber)";

      return (
        <div className="fade-in" style={{
          background: "var(--bg-secondary)",
          border: "1px solid var(--border)",
          borderRadius: "var(--radius)",
          padding: 24,
          flex: 1,
          minWidth: 300,
          boxShadow: "var(--shadow)",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
            <div style={{
              width: 10, height: 10, borderRadius: "50%",
              background: corVar,
              boxShadow: `0 0 8px ${corVar}`,
            }} />
            <h3 style={{ fontSize: 18, fontWeight: 700 }}>{ap.nome}</h3>
          </div>

          <p style={{ color: "var(--text-muted)", fontSize: 13, marginBottom: 16 }}>{ap.tipo}</p>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
            <div style={{ background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)", padding: "12px" }}>
              <p style={{ color: "var(--text-muted)", fontSize: 11, marginBottom: 4 }}>VALOR TOTAL</p>
              <p className="mono" style={{ fontSize: 16, fontWeight: 600 }}>{fmt(ap.valorTotal)}</p>
            </div>
            <div style={{ background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)", padding: "12px" }}>
              <p style={{ color: "var(--text-muted)", fontSize: 11, marginBottom: 4 }}>PARCELA POS-CHAVE</p>
              <p className="mono" style={{ fontSize: 16, fontWeight: 600 }}>{fmt(ap.parcelaPosChave)}</p>
            </div>
            <div style={{ background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)", padding: "12px" }}>
              <p style={{ color: "var(--text-muted)", fontSize: 11, marginBottom: 4 }}>SALDO NA ENTREGA</p>

    function Dashboard() {
      const params = DEFAULTS;
      const pl = APARTAMENTOS.palestraLife;
      const up = APARTAMENTOS.uniquePalestra;

      const saldoPL = calcSaldoEntrega(pl.financiamento, params.incc, pl.mesesObra);
      const saldoUP = calcSaldoEntrega(up.financiamento, params.incc, up.mesesObra);
      const prazoM = params.prazoAnos * 12;
      const taxa = params.taxaJuros + params.tr * 12;
      const mesesRestPL = diffMeses(new Date(), pl.entrega);
      const mesesRestUP = diffMeses(new Date(), up.entrega);
      const taxaObraPL = calcTaxaObraTotal(pl.financiamento, params.taxaJuros, mesesRestPL, pl.percentualObra);
      const taxaObraUP = calcTaxaObraTotal(up.financiamento, params.taxaJuros, mesesRestUP, up.percentualObra);
      const jurosPL = calcTotalJurosPRICE(saldoPL, taxa, prazoM);
      const jurosUP = calcTotalJurosPRICE(saldoUP, taxa, prazoM);
      const totalPL = saldoPL + jurosPL + taxaObraPL;
      const totalUP = saldoUP + jurosUP + taxaObraUP;
      const maisBarato = totalPL < totalUP ? "Palestra Life" : "Unique Palestra";

      return (
        <div className="fade-in" style={{ maxWidth: 1200, margin: "0 auto", padding: 20 }}>

            <div style={{
              width: 40, height: 40, borderRadius: 10,

            </div>
            <div style={{ marginLeft: "auto", textAlign: "right" }}>
              <p className="mono" style={{ fontSize: 13, color: "var(--text-muted)" }}>Diferenca</p>
              <p className="mono" style={{ fontSize: 16, fontWeight: 600 }}>{fmt(Math.abs(totalPL - totalUP))}</p>
            </div>
          </div>

          {/* Cards */}
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>

    // ========================
    // TELA: SIMULADOR
    // ========================
    function Simulador() {
      const [incc, setIncc] = useState(DEFAULTS.incc);
      const [taxaJuros, setTaxaJuros] = useState(DEFAULTS.taxaJuros);
      const [prazoAnos, setPrazoAnos] = useState(DEFAULTS.prazoAnos);
      const [fgtsExtra, setFgtsExtra] = useState(0);
      const pl = APARTAMENTOS.palestraLife;
      const up = APARTAMENTOS.uniquePalestra;
      const tr = DEFAULTS.tr;
      const taxaTotal = taxaJuros + tr * 12;
      const prazoM = prazoAnos * 12;

      const saldoPL = calcSaldoEntrega(pl.financiamento, incc, pl.mesesObra) - fgtsExtra;
      const saldoUP = calcSaldoEntrega(up.financiamento, incc, up.mesesObra) - fgtsExtra;

      const parcelaPL = calcParcelaPRICE(Math.max(0, saldoPL), taxaTotal, prazoM);
      const parcelaUP = calcParcelaPRICE(Math.max(0, saldoUP), taxaTotal, prazoM);
      const jurosPL = calcTotalJurosPRICE(Math.max(0, saldoPL), taxaTotal, prazoM);
      const jurosUP = calcTotalJurosPRICE(Math.max(0, saldoUP), taxaTotal, prazoM);

      const mesesRestPL = diffMeses(new Date(), pl.entrega);
      const mesesRestUP = diffMeses(new Date(), up.entrega);
      const taxaObraPL = calcTaxaObraTotal(pl.financiamento, taxaJuros, mesesRestPL, pl.percentualObra);
      const taxaObraUP = calcTaxaObraTotal(up.financiamento, taxaJuros, mesesRestUP, up.percentualObra);
      const taxaObraMesPL = calcTaxaObraMensal(pl.financiamento, taxaJuros, pl.percentualObra);
      const taxaObraMesUP = calcTaxaObraMensal(up.financiamento, taxaJuros, up.percentualObra);

      const totalPL = Math.max(0, saldoPL) + jurosPL + taxaObraPL;
      const totalUP = Math.max(0, saldoUP) + jurosUP + taxaObraUP;

      const SliderRow = ({ label, value, setValue, min, max, step, unit }) => (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 500 }}>{label}</span>
            <span className="mono" style={{ fontSize: 14, fontWeight: 600, color: "var(--accent-indigo)" }}>
              {typeof value === "number" && unit === "R$" ? fmt(value) : `${fmtNum(value, step < 1 ? 1 : 0)}${unit}`}
            </span>
          </div>
          <input
            type="range" min={min} max={max} step={step}
            value={value}
            onChange={(e) => setValue(Number(e.target.value))}
          />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
            <span style={{ fontSize: 11, color: "var(--text-muted)" }}>{min}{unit}</span>
            <span style={{ fontSize: 11, color: "var(--text-muted)" }}>{max}{unit}</span>
          </div>
        </div>
      );

      const ResultBlock = ({ nome, cor, parcela, juros, total, saldo, taxaObraMes, taxaObraTotal }) => (
        <div style={{
          background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)",
          padding: 20, borderLeft: `3px solid ${cor}`, flex: 1, minWidth: 260,
        }}>
          <h4 style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>{nome}</h4>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <div>
              <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>SALDO ENTREGA</p>
              <p className="mono" style={{ fontSize: 15, fontWeight: 600 }}>{fmt(saldo)}</p>
            </div>
            <div>
              <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>PARCELA PRICE</p>
              <p className="mono" style={{ fontSize: 15, fontWeight: 600 }}>{fmt(parcela)}</p>
            </div>
            <div>
              <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>TAXA OBRA/MES</p>
              <p className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--accent-amber)" }}>{fmt(taxaObraMes)}</p>
            </div>
            <div>
              <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>TAXA OBRA TOTAL</p>
              <p className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--accent-amber)" }}>{fmt(taxaObraTotal)}</p>
            </div>
            <div style={{ gridColumn: "1 / -1" }}>
              <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>TOTAL JUROS FINANCIAMENTO</p>
              <p className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--accent-red)" }}>{fmt(juros)}</p>
            </div>
          </div>
          <div style={{
            marginTop: 16, paddingTop: 16,
            borderTop: "1px solid var(--border)",
          }}>
            <p style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 2 }}>CUSTO TOTAL DO IMOVEL</p>
            <p className="mono" style={{ fontSize: 22, fontWeight: 700 }}>{fmt(total)}</p>
            <p style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 4 }}>(financiamento + juros + taxa obra)</p>
          </div>
        </div>
      );

      return (
        <div className="fade-in" style={{ maxWidth: 1200, margin: "0 auto", padding: 20 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 24 }}>Simulador de Cenarios</h2>

          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            {/* Controls */}
            <div style={{
              background: "var(--bg-secondary)", border: "1px solid var(--border)",
              borderRadius: "var(--radius)", padding: 24, flex: "1 1 320px",
              boxShadow: "var(--shadow)",
            }}>
              <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 20 }}>Parametros</h3>
              <SliderRow label="INCC (a.a.)" value={incc} setValue={setIncc} min={3} max={15} step={0.5} unit="%" />
              <SliderRow label="Taxa de Juros (a.a.)" value={taxaJuros} setValue={setTaxaJuros} min={7} max={14} step={0.5} unit="%" />
              <SliderRow label="Prazo" value={prazoAnos} setValue={setPrazoAnos} min={15} max={35} step={1} unit=" anos" />
              <SliderRow label="FGTS Extra (amort.)" value={fgtsExtra} setValue={setFgtsExtra} min={0} max={50000} step={1000} unit="R$" />

              <div style={{
                marginTop: 16, padding: 12,
                background: "var(--bg-tertiary)", borderRadius: "var(--radius-sm)",
                border: "1px solid var(--border)",
              }}>
                <p style={{ fontSize: 13, fontWeight: 600, color: "var(--accent-indigo)", marginBottom: 4 }}>Sistema: Tabela PRICE</p>
                <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Parcelas fixas durante todo o financiamento</p>
              </div>
            </div>

            {/* Results */}
            <div style={{ flex: "2 1 500px", display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                <ResultBlock
                  nome="Palestra Life"
                  cor="var(--accent-indigo)"
                  parcela={parcelaPL}
                  juros={jurosPL} total={totalPL}
                  saldo={Math.max(0, saldoPL)}
                  taxaObraMes={taxaObraMesPL}
                  taxaObraTotal={taxaObraPL}
                />
                <ResultBlock
                  nome="Unique Palestra"
                  cor="var(--accent-amber)"
                  parcela={parcelaUP}
                  juros={jurosUP} total={totalUP}
                  saldo={Math.max(0, saldoUP)}
                  taxaObraMes={taxaObraMesUP}
                  taxaObraTotal={taxaObraUP}
                />
              </div>

              {/* Comparison bar */}
              <div style={{
                background: "var(--bg-secondary)", border: "1px solid var(--border)",
                borderRadius: "var(--radius)", padding: 20, boxShadow: "var(--shadow)",
              }}>
                <h4 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Comparativo Visual - Custo Total</h4>
                <div style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontSize: 13 }}>Palestra Life</span>
                    <span className="mono" style={{ fontSize: 13 }}>{fmt(totalPL)}</span>
                  </div>
                  <div style={{ height: 12, background: "var(--border)", borderRadius: 6, overflow: "hidden" }}>
                    <div style={{
                      height: "100%",
                      width: `${(totalPL / Math.max(totalPL, totalUP)) * 100}%`,
                      background: "linear-gradient(90deg, var(--accent-indigo), var(--accent-indigo-light))",
                      borderRadius: 6,
                      transition: "width 0.5s",
                    }} />
                  </div>
                </div>
                <div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontSize: 13 }}>Unique Palestra</span>
                    <span className="mono" style={{ fontSize: 13 }}>{fmt(totalUP)}</span>
                  </div>
                  <div style={{ height: 12, background: "var(--border)", borderRadius: 6, overflow: "hidden" }}>
                    <div style={{
                      height: "100%",
                      width: `${(totalUP / Math.max(totalPL, totalUP)) * 100}%`,
                      background: "linear-gradient(90deg, var(--accent-amber), var(--accent-amber-light))",
                      borderRadius: 6,
                      transition: "width 0.5s",
                    }} />
                  </div>
                </div>
                <p style={{
                  textAlign: "center", marginTop: 12,
                  fontSize: 13, color: "var(--accent-green)", fontWeight: 600,
                }}>
                  Economia: {fmt(Math.abs(totalPL - totalUP))} com {totalPL < totalUP ? "Palestra Life" : "Unique Palestra"}
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // TELA: ANOTACOES
    // ========================
    function Anotacoes() {
      const [notas, setNotas] = useState(() => {
        try { return JSON.parse(localStorage.getItem("meuap_notas") || "[]"); } catch { return []; }
      });
      const [texto, setTexto] = useState("");
      const [categoria, setCategoria] = useState("Lembrete");

      const categorias = ["Duvida", "Lembrete", "Decisao", "Contato"];
      const catCores = { Duvida: "var(--accent-amber)", Lembrete: "var(--accent-indigo)", Decisao: "var(--accent-green)", Contato: "var(--text-muted)" };

      useEffect(() => {
        localStorage.setItem("meuap_notas", JSON.stringify(notas));
      }, [notas]);

      const addNota = () => {
        if (!texto.trim()) return;
        const nova = {
          id: Date.now(),
          texto: texto.trim(),
          categoria,
          data: new Date().toLocaleString("pt-BR"),
        };
        setNotas([nova, ...notas]);
        setTexto("");
      };

      const delNota = (id) => {
        setNotas(notas.filter(n => n.id !== id));
      };

      return (
        <div className="fade-in" style={{ maxWidth: 800, margin: "0 auto", padding: 20 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 24 }}>Anotacoes</h2>

          {/* Add note */}
          <div style={{
            background: "var(--bg-secondary)", border: "1px solid var(--border)",
            borderRadius: "var(--radius)", padding: 20, marginBottom: 24,
            boxShadow: "var(--shadow)",
          }}>
            <textarea
              value={texto}
              onChange={(e) => setTexto(e.target.value)}
              placeholder="Escreva uma nota..."
              rows={3}
              style={{
                width: "100%", padding: 14,
                background: "var(--bg-tertiary)", border: "1px solid var(--border)",
                borderRadius: "var(--radius-sm)", color: "var(--text-primary)",
                fontSize: 14, fontFamily: "inherit", resize: "vertical", outline: "none",
              }}
            />
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
              {categorias.map(c => (
                <button key={c} onClick={() => setCategoria(c)} style={{
                  padding: "6px 14px",
                  background: categoria === c ? catCores[c] : "var(--bg-tertiary)",
                  color: categoria === c ? "#fff" : "var(--text-secondary)",
                  border: `1px solid ${categoria === c ? catCores[c] : "var(--border)"}`,
                  borderRadius: 6, cursor: "pointer", fontSize: 13,
                  fontFamily: "inherit", fontWeight: 500,
                }}>{c}</button>
              ))}
              <button onClick={addNota} style={{
                marginLeft: "auto",
                padding: "8px 20px",
                background: "var(--accent-indigo)", color: "#fff",
                border: "none", borderRadius: "var(--radius-sm)",
                cursor: "pointer", fontSize: 14, fontWeight: 600,
                fontFamily: "inherit",
                display: "flex", alignItems: "center", gap: 6,
                opacity: texto.trim() ? 1 : 0.5,
              }}>
                <Icons.Plus /> Adicionar
              </button>
            </div>
          </div>

          {/* Notes list */}
          {notas.length === 0 ? (
            <div style={{
              textAlign: "center", padding: 40,
              color: "var(--text-muted)", fontSize: 14,
            }}>
              Nenhuma anotacao ainda. Comece escrevendo acima!
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {notas.map(n => (
                <div key={n.id} style={{
                  background: "var(--bg-secondary)", border: "1px solid var(--border)",
                  borderRadius: "var(--radius)", padding: "16px 20px",
                  boxShadow: "var(--shadow)",
                  borderLeft: `3px solid ${catCores[n.categoria] || "var(--border)"}`,
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{
                      fontSize: 11, fontWeight: 600,
                      color: catCores[n.categoria] || "var(--text-muted)",
                      background: "var(--bg-tertiary)",
                      padding: "2px 8px", borderRadius: 4,
                    }}>{n.categoria}</span>
                    <span style={{ fontSize: 12, color: "var(--text-muted)", display: "flex", alignItems: "center", gap: 4 }}>
                      <Icons.Clock /> {n.data}
                    </span>
                    <button onClick={() => delNota(n.id)} style={{
                      marginLeft: "auto",
                      background: "none", border: "none", cursor: "pointer",
                      color: "var(--text-muted)", padding: 4,
                      display: "flex", alignItems: "center",
                    }}
                    onMouseOver={(e) => e.currentTarget.style.color = "var(--accent-red)"}
                    onMouseOut={(e) => e.currentTarget.style.color = "var(--text-muted)"}
                    >
                      <Icons.Trash />
                    </button>
                  </div>
                  <p style={{ fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{n.texto}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ========================
    // TELA: FAQ
    // ========================
    function FAQ() {
      const [open, setOpen] = useState(null);

      const perguntas = [
        {
          q: "O que e INCC e como afeta minha parcela?",
          a: "O INCC (Indice Nacional de Custo da Construcao) e o indice usado para reajustar o saldo devedor durante a obra. Ele reflete o aumento dos custos de construcao civil. Na pratica, seu saldo devedor sobe todo mes de acordo com o INCC ate a entrega das chaves. Por isso, o valor financiado na entrega sera maior que o valor original do contrato. A media recente fica em torno de 6% ao ano."
        },
        {
          q: "O que e a Tabela PRICE?",
          a: "Na Tabela PRICE, as parcelas sao fixas durante todo o financiamento. No inicio, a maior parte da parcela vai para juros e pouco para amortizacao. Com o tempo, essa proporcao se inverte. A vantagem e a previsibilidade: voce sabe exatamente quanto vai pagar todo mes. O seu financiamento foi feito nesse sistema."
        },
        {
          q: "O que e taxa de obra (juros de interveniencia)?",
          a: "Durante a construcao, o banco libera dinheiro para a construtora conforme a obra avanca. Voce paga juros mensais sobre o valor ja liberado — isso e a 'taxa de obra' ou 'juros de obra'. Conforme a obra progride e mais dinheiro e liberado, essa taxa mensal aumenta. So para quando voce recebe a chave e comeca o financiamento normal. E um custo importante de considerar no planejamento."
        },
        {
          q: "Como funciona o FGTS na amortizacao?",
          a: "Voce pode usar o FGTS a cada 2 anos para amortizar (reduzir) o saldo devedor do financiamento. Isso pode diminuir o prazo ou o valor das parcelas. Tambem pode ser usado na entrada. Requisitos: ter pelo menos 3 anos de trabalho com carteira assinada (nao precisa ser consecutivo), nao ter outro financiamento ativo no SFH, e o imovel deve estar na cidade onde voce mora ou trabalha."
        },
        {
          q: "O que e TR e como afeta o financiamento?",
          a: "A TR (Taxa Referencial) e um indice calculado pelo Banco Central que incide sobre o saldo devedor do financiamento imobiliario apos a entrega das chaves. Junto com a taxa de juros do banco, ela compoe o custo total do financiamento. Atualmente gira em torno de 0,1% ao mes. Quando o banco diz '9,5% + TR', significa que a taxa efetiva sera um pouco maior que 9,5%."
        },
        {
          q: "O que significa 'entrada zerada'?",
          a: "Significa que voce nao precisa pagar nenhum valor de entrada no ato da compra. O valor total do imovel sera financiado. No caso do Unique Palestra, os R$ 5.000 de FGTS funcionam como uma especie de sinal, mas o restante e 100% financiado. Isso e possivel em programas como o Minha Casa Minha Vida ou condicoes especiais da construtora."
        },
        {
          q: "O que e documentacao gratis?",
          a: "Normalmente, ao comprar um imovel, voce paga custos de documentacao como: escritura publica, registro em cartorio, ITBI (Imposto de Transmissao de Bens Imoveis - geralmente 2-3% do valor). Quando a construtora oferece 'documentacao gratis', ela arca com esses custos, o que pode representar uma economia de R$ 5.000 a R$ 15.000."
        },
        {
          q: "Como funciona a vistoria?",
          a: "A vistoria e feita antes de receber as chaves. Voce (ou um engenheiro contratado) vai ao imovel verificar: acabamentos, pinturas, pisos, instalacoes eletricas e hidraulicas, portas, janelas, medidas dos comodos. Se encontrar problemas, a construtora deve corrigir antes da entrega. E seu direito e muito importante fazer com cuidado."
        },
        {
          q: "Posso vender o apartamento na planta?",
          a: "Sim, e possivel fazer a cessao de direitos do contrato para outra pessoa (venda na planta). Voce vende seu 'lugar' no contrato. Geralmente a construtora cobra uma taxa de cessao (2-5% do valor). E importante verificar o contrato para saber as regras especificas. Se o imovel valorizar durante a obra, voce pode lucrar com a venda."
        },
        {
          q: "O que e taxa de seguro da obra?",
          a: "Durante a construcao, existe um seguro obrigatorio que cobre riscos como danos a obra, acidentes e morte/invalidez do comprador. O custo gira em torno de 0,3% a 0,5% do valor do imovel por ano. Em geral, ja esta embutido nas parcelas durante a obra ou e cobrado separadamente pela construtora."
        },
        {
          q: "O que acontece quando pego a chave?",
          a: "Ao receber a chave, encerra a fase de obra (e a taxa de obra) e comeca o financiamento bancario. O saldo devedor (ja corrigido pelo INCC) e transferido para o banco, que aplica a taxa de juros contratada. Voce passa a pagar as parcelas fixas do financiamento (Tabela PRICE). Tambem e nesse momento que voce pode comecar a morar no imovel ou aluga-lo."
        },
      ];

      return (
        <div className="fade-in" style={{ maxWidth: 800, margin: "0 auto", padding: 20 }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Perguntas Frequentes</h2>
          <p style={{ color: "var(--text-muted)", fontSize: 14, marginBottom: 24 }}>
            Tudo que voce precisa saber sobre financiamento imobiliario
          </p>

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {perguntas.map((p, i) => (
              <div key={i} style={{
                background: "var(--bg-secondary)", border: "1px solid var(--border)",
                borderRadius: "var(--radius)",
                boxShadow: "var(--shadow)",
                overflow: "hidden",
              }}>
                <button
                  onClick={() => setOpen(open === i ? null : i)}
                  style={{
                    width: "100%", padding: "16px 20px",
                    background: "none", border: "none",
                    color: "var(--text-primary)", cursor: "pointer",
                    fontFamily: "inherit", fontSize: 15, fontWeight: 500,
                    display: "flex", alignItems: "center", justifyContent: "space-between",
                    textAlign: "left",
                  }}
                >
                  <span>{p.q}</span>
                  <span style={{
                    transform: open === i ? "rotate(180deg)" : "rotate(0)",
                    transition: "transform 0.2s",
                    flexShrink: 0,
                    marginLeft: 12,
                  }}>
                    <Icons.ChevronDown />
                  </span>
                </button>
                {open === i && (
                  <div style={{
                    padding: "0 20px 16px",
                    color: "var(--text-secondary)",
                    fontSize: 14,
                    lineHeight: 1.7,
                  }}>
                    {p.a}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ========================
    // APP PRINCIPAL
    // ========================
    function App() {
      const [loggedIn, setLoggedIn] = useState(() => sessionStorage.getItem("meuap_auth") === "1");
      const [page, setPage] = useState("dashboard");
      const [theme, setTheme] = useState(() => localStorage.getItem("meuap_theme") || "dark");

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("meuap_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

      const handleLogout = () => {
        sessionStorage.removeItem("meuap_auth");
        setLoggedIn(false);
      };

      if (!loggedIn) return <LoginScreen onLogin={() => setLoggedIn(true)} />;

      const pages = {
        dashboard: Dashboard,
        cronograma: Cronograma,
        simulador: Simulador,
        anotacoes: Anotacoes,
        faq: FAQ,
      };

      const PageComponent = pages[page] || Dashboard;

      return (
        <div style={{ minHeight: "100vh", background: "var(--bg-primary)" }}>
          <Header page={page} setPage={setPage} theme={theme} toggleTheme={toggleTheme} onLogout={handleLogout} />
          <main style={{ paddingBottom: 40 }}>
            <PageComponent />
          </main>
          <footer style={{
            textAlign: "center", padding: "20px",
            color: "var(--text-muted)", fontSize: 12,
            borderTop: "1px solid var(--border)",
          }}>
            Meu AP &mdash; Planejamento Financeiro Imobiliario &mdash; 2026
          </footer>
        </div>
      );
    }

    // ========================
    // RENDER
    // ========================
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
