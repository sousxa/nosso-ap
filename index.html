  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #09090b;
      --bg-secondary: #141416;
      --bg-tertiary: #1c1c1f;
      --bg-hover: #27272a;
      --border: #27272a;
      --border-light: #3f3f46;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent-indigo: #6366f1;
      --accent-indigo-light: #818cf8;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --shadow: 0 2px 6px rgba(0,0,0,0.35);
      --shadow-lg: 0 6px 20px rgba(0,0,0,0.45);
      --radius: 18px;
      --radius-sm: 12px;
      --radius-lg: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --bg-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-light: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-indigo: #4f46e5;
      --accent-indigo-light: #6366f1;
      --accent-amber: #d97706;
      --accent-amber-light: #f59e0b;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --shadow: 0 2px 6px rgba(0,0,0,0.06);
      --shadow-lg: 0 6px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 6px;
      border-radius: 3px; background: var(--border); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent-indigo); cursor: pointer;
      border: 2px solid var(--bg-secondary); box-shadow: var(--shadow);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease-out; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(99,102,241,0.3), 0 0 24px rgba(99,102,241,0.1); }
      50% { box-shadow: 0 0 20px rgba(99,102,241,0.5), 0 0 40px rgba(99,102,241,0.2); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes staggerIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow-icon {
      animation: glowPulse 3s ease-in-out infinite;
    }
    .float-anim {
      animation: float 4s ease-in-out infinite;
    }
    .module-card {
      animation: fadeScale 0.4s ease-out backwards;
    }
    .module-card:nth-child(1) { animation-delay: 0.05s; }
    .module-card:nth-child(2) { animation-delay: 0.1s; }
    .module-card:nth-child(3) { animation-delay: 0.15s; }
    .module-card:nth-child(4) { animation-delay: 0.2s; }
    .module-card:nth-child(5) { animation-delay: 0.25s; }
    .module-card:nth-child(6) { animation-delay: 0.3s; }
    .module-card:nth-child(7) { animation-delay: 0.35s; }

    .page-container { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 110px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-2-lg { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 400px) {
      .grid-2 { grid-template-columns: 1fr; }
      .page-container { padding: 16px; padding-bottom: 110px; }
    }

    /* PDF rotate hint - visible only in portrait on small screens */
    @media (orientation: portrait) and (max-width: 768px) {
      .pdf-rotate-hint { display: flex !important; }
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: calc(14px + var(--safe-bottom));
      left: 20px; right: 20px;
      background: rgba(20,20,22,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-around; align-items: center;
      padding: 6px 8px;
      z-index: 100;
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      animation: slideUp 0.5s ease-out;
    }
    [data-theme="light"] .bottom-nav {
      background: rgba(255,255,255,0.88);
      border-color: rgba(0,0,0,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04) inset;
    }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-family: inherit; font-size: 11px;
      padding: 10px 18px; border-radius: 18px; transition: all 0.25s ease;
      min-width: 64px; font-weight: 500;
    }
    .bottom-nav button.active {
      color: var(--accent-indigo);
      background: rgba(99,102,241,0.12);
    }
    .bottom-nav button.active svg {
      filter: drop-shadow(0 0 8px rgba(99,102,241,0.6));
    }

    /* Page header */
    .page-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      padding-top: calc(14px + var(--safe-top));
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .page-header h2 { font-size: 18px; font-weight: 700; flex: 1; }

    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--bg-tertiary); border: 1px solid var(--border);
      color: var(--text-primary); cursor: pointer;
    }

    /* Module cards */
    .module-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .module-card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: var(--shadow);
    }
    .module-card:active { transform: scale(0.96); background: var(--bg-tertiary); }

    /* Search overlay */
    .search-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 150;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; flex-direction: column; padding: 20px;
      padding-top: calc(20px + var(--safe-top));
    }
    .search-input {
      width: 100%; padding: 16px 20px 16px 48px;
      background: var(--bg-secondary); border: 1px solid var(--border-light);
      border-radius: var(--radius); color: var(--text-primary);
      font-size: 17px; font-family: inherit; outline: none;
      box-shadow: var(--shadow-lg);
    }
    .search-result {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.15s;
    }
    .search-result:active { background: var(--bg-tertiary); transform: scale(0.98); }

    /* Onboarding */
    .onboarding-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .onboarding-card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 28px; padding: 40px 28px; max-width: 380px; width: 100%;
      text-align: center; animation: slideUp 0.4s ease-out;
      box-shadow: var(--shadow-lg);
    }

    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}
    }
  </style>
</head>

    const fmt = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    function calcSaldoEntrega(saldo, inccAnual, meses) {
      const mensal = Math.pow(1 + inccAnual / 100, 1 / 12) - 1;
      return saldo * Math.pow(1 + mensal, meses);
    }

    function calcParcelaPRICE(saldo, taxaAnual, prazoMeses) {
      const i = Math.pow(1 + taxaAnual / 100, 1 / 12) - 1;
      if (i === 0) return saldo / prazoMeses;
      const fator = Math.pow(1 + i, prazoMeses);
      return saldo * (i * fator) / (fator - 1);
    }

    function calcTotalJurosPRICE(saldo, taxaAnual, prazoMeses) {
      const parcela = calcParcelaPRICE(saldo, taxaAnual, prazoMeses);
      return (parcela * prazoMeses) - saldo;
    }

    function gerarEvolucaoObra(financiamento, taxaJurosAnual, inccAnual, mesesRestantes, percentualAtual) {
      const jurosMensal = Math.pow(1 + taxaJurosAnual / 100, 1 / 12) - 1;
      const inccMensal = Math.pow(1 + inccAnual / 100, 1 / 12) - 1;
      const percAtual = percentualAtual / 100;
      const meses = [];
      let saldo = financiamento;

      for (let m = 0; m < mesesRestantes; m++) {
        const perc = percAtual + ((1 - percAtual) * ((m + 1) / mesesRestantes));
        const valorLiberado = financiamento * perc;
        const jurosMes = valorLiberado * jurosMensal;
        saldo *= (1 + inccMensal);
        meses.push({ mes: m + 1, percentual: Math.round(perc * 100), valorLiberado, jurosMes, saldo });
      }
      return meses;
    }

    function gerarEvolucaoSaldo(saldo, inccAnual, meses) {
      const mensal = Math.pow(1 + inccAnual / 100, 1 / 12) - 1;
      const pontos = [{ mes: 0, saldo }];
      let s = saldo;
      for (let m = 1; m <= meses; m++) { s *= (1 + mensal); pontos.push({ mes: m, saldo: s }); }
      return pontos;
    }

    function diffMeses(from, to) {
      const d = new Date();
      const months = (to.getFullYear() - d.getFullYear()) * 12 + (to.getMonth() - d.getMonth());
      return Math.max(0, months);
    }

    function diffDias(to) {
      const now = new Date();
      return Math.max(0, Math.ceil((to - now) / (1000 * 60 * 60 * 24)));
    }

    function progresso(entrega, mesesObra) {
      const now = new Date();
      const inicio = new Date(entrega);
      inicio.setMonth(inicio.getMonth() - mesesObra);
      const total = entrega - inicio;
      const elapsed = now - inicio;
      return Math.min(100, Math.max(0, (elapsed / total) * 100));
    }

    // ========================
    // PWA INSTALL PROMPT
    // ========================
    function InstallBanner() {
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showIOSInstructions, setShowIOSInstructions] = useState(false);
      const [dismissed, setDismissed] = useState(() => localStorage.getItem("nossoap_install_dismissed") === "1");

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener("beforeinstallprompt", handler);
        return () => window.removeEventListener("beforeinstallprompt", handler);
      }, []);

      if (isStandalone || dismissed) return null;
      if (!deferredPrompt && !isIOS) return null;

      const handleInstall = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          if (result.outcome === "accepted") setDismissed(true);
          setDeferredPrompt(null);
        }
      };

      const handleDismiss = () => {
        setDismissed(true);
        localStorage.setItem("nossoap_install_dismissed", "1");
      };

      return html`
        <div style=${{
          background: "linear-gradient(135deg, rgba(99,102,241,0.15), rgba(245,158,11,0.15))",
          border: "1px solid var(--border)",
          borderRadius: "var(--radius)", padding: "16px 18px", marginBottom: 16,
          display: "flex", alignItems: "center", gap: 12,
        }}>
          <div style=${{
            width: 40, height: 40, borderRadius: 10, flexShrink: 0,
            background: "linear-gradient(135deg, var(--accent-indigo), var(--accent-amber))",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}><${Icons.Smartphone} /></div>
          <div style=${{ flex: 1, minWidth: 0 }}>
            <p style=${{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>Instalar como app</p>
            ${isIOS && !deferredPrompt ? html`
              <p style=${{ fontSize: 11, color: "var(--text-muted)", lineHeight: 1.4 }}>
                Toque em <${Icons.Share} /> e depois "Adicionar a Tela de Inicio"
              </p>
            ` : html`
              <p style=${{ fontSize: 11, color: "var(--text-muted)" }}>Acesse direto da tela inicial</p>
            `}
          </div>
          ${deferredPrompt && html`
            <button onClick=${handleInstall} style=${{
              padding: "8px 14px", background: "var(--accent-indigo)", color: "#fff",
              border: "none", borderRadius: "var(--radius-sm)", fontSize: 12,
              fontWeight: 600, fontFamily: "inherit", cursor: "pointer", whiteSpace: "nowrap",
            }}>Instalar</button>
          `}
          <button onClick=${handleDismiss} style=${{
            background: "none", border: "none", color: "var(--text-muted)",
            cursor: "pointer", padding: 4, display: "flex", flexShrink: 0,
          }}><${Icons.X} /></button>
        </div>
      `;
    }

    function SaldoEvolutionChart({ pontos, cor, width, height }) {
      if (!pontos.length) return null;
      const w = width || 300;
      const h = height || 110;
      const pad = { top: 10, right: 10, bottom: 25, left: 10 };
      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;

      const minVal = pontos[0].saldo * 0.99;
      const maxVal = pontos[pontos.length - 1].saldo * 1.01;
      const range = maxVal - minVal || 1;

      const pathPoints = pontos.map((p, i) => {
        const x = pad.left + (i / (pontos.length - 1)) * chartW;
        const y = pad.top + chartH - ((p.saldo - minVal) / range) * chartH;
        return `${x},${y}`;
      });

      const areaPath = `M${pathPoints[0]} ${pathPoints.map(p => `L${p}`).join(' ')} L${pad.left + chartW},${pad.top + chartH} L${pad.left},${pad.top + chartH} Z`;
      const linePath = `M${pathPoints.join(' L')}`;

      return html`
        <svg width="100%" viewBox=${`0 0 ${w} ${h}`} style=${{ display: "block" }}>
          <defs>
            <linearGradient id=${`grad-${cor}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor=${cor} stopOpacity="0.3" />
              <stop offset="100%" stopColor=${cor} stopOpacity="0.02" />
            </linearGradient>
          </defs>
          <path d=${areaPath} fill=${`url(#grad-${cor})`} />
          <path d=${linePath} fill="none" stroke=${cor} strokeWidth="2" />
          <text x=${pad.left} y=${h - 4} fill="var(--text-muted)" fontSize="9" fontFamily="JetBrains Mono">${fmt(pontos[0].saldo)}</text>
          <text x=${w - pad.right} y=${h - 4} fill=${cor} fontSize="9" fontFamily="JetBrains Mono" textAnchor="end">${fmt(pontos[pontos.length - 1].saldo)}</text>
          <text x=${w / 2} y=${h - 4} fill="var(--text-muted)" fontSize="9" fontFamily="DM Sans" textAnchor="middle">${pontos.length - 1} meses</text>
        </svg>
      `;
    }

    function PdfViewer({ doc, onBack }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const [pdfDoc, setPdfDoc] = useState(null);
      const [pageNum, setPageNum] = useState(1);
      const [numPages, setNumPages] = useState(0);
      const [scale, setScale] = useState(null);
      const [baseScale, setBaseScale] = useState(1);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const renderTaskRef = useRef(null);

      // Force landscape orientation + hide bottom nav + fullscreen
      useEffect(() => {
        // Hide bottom nav
        const nav = document.querySelector(".bottom-nav");
        if (nav) nav.style.display = "none";

        // Enter fullscreen + lock to landscape
        const goFullscreen = async () => {
          try {
            const el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen();
            else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
          } catch (e) {}
          try {
            await screen.orientation.lock("landscape");
          } catch (e) {}
        };
        goFullscreen();

        return () => {
          // Restore bottom nav
          if (nav) nav.style.display = "";
          // Exit fullscreen + unlock orientation
          try { screen.orientation.unlock(); } catch (e) {}
          try {
            if (document.fullscreenElement) document.exitFullscreen();
            else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
          } catch (e) {}
        };
      }, []);

      // Load PDF document
      useEffect(() => {
        if (!window.pdfjsLib) {
          setError("PDF.js nao carregou. Tente recarregar.");
          setLoading(false);
          return;
        }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        let cancelled = false;
        const loadingTask = window.pdfjsLib.getDocument(doc.arquivo);
        loadingTask.promise.then(pdf => {
          if (!cancelled) {
            setPdfDoc(pdf);
            setNumPages(pdf.numPages);
            setLoading(false);
          }
        }).catch(err => {
          if (!cancelled) {
            console.error("PDF load error:", err);
            setError("Erro ao carregar PDF.");
            setLoading(false);
          }
        });
        return () => { cancelled = true; loadingTask.destroy(); };
      }, [doc.arquivo]);

      // Render current page
      useEffect(() => {
        if (!pdfDoc || !canvasRef.current) return;
        let cancelled = false;

        pdfDoc.getPage(pageNum).then(page => {
          if (cancelled) return;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d");
          const container = containerRef.current;

          // Calculate fit-to-width scale
          const containerWidth = container ? container.clientWidth - 16 : window.innerWidth - 16;
          const viewport0 = page.getViewport({ scale: 1 });
          const fitScale = containerWidth / viewport0.width;

          if (scale === null) {
            setScale(fitScale);
            setBaseScale(fitScale);
          }

          const currentScale = scale === null ? fitScale : scale;
          const viewport = page.getViewport({ scale: currentScale });
          const dpr = window.devicePixelRatio || 1;

          canvas.width = viewport.width * dpr;
          canvas.height = viewport.height * dpr;
          canvas.style.width = viewport.width + "px";
          canvas.style.height = viewport.height + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Cancel previous render
          if (renderTaskRef.current) {
            renderTaskRef.current.cancel();
          }

          const task = page.render({ canvasContext: ctx, viewport });
          renderTaskRef.current = task;
          task.promise.catch(err => {
            if (err.name !== "RenderingCancelled") console.error(err);
          });
        });

        return () => { cancelled = true; };
      }, [pdfDoc, pageNum, scale]);

      // Recalculate fit scale on resize
      useEffect(() => {
        const handleResize = () => {
          if (containerRef.current && pdfDoc) {
            setScale(null); // trigger re-fit
          }
        };
        window.addEventListener("resize", handleResize);
        return () => window.removeEventListener("resize", handleResize);
      }, [pdfDoc]);

      const goPage = (n) => {
        const p = Math.max(1, Math.min(numPages, n));
        setPageNum(p);
      };

      const zoomIn = () => setScale(s => Math.min((s || baseScale) * 1.3, baseScale * 4));
      const zoomOut = () => setScale(s => Math.max((s || baseScale) * 0.7, baseScale * 0.5));
      const zoomFit = () => setScale(null);

      const btnSmall = {
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        padding: "8px 10px", background: "var(--bg-tertiary)",
        border: "1px solid var(--border)", borderRadius: "var(--radius-sm)",
        color: "var(--text-secondary)", fontSize: 13, fontFamily: "inherit",
        cursor: "pointer", flexShrink: 0, minWidth: 40, minHeight: 40,
      };

      const btnNav = {
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
        padding: "12px 20px", background: "var(--bg-tertiary)",
        border: "1px solid var(--border)", borderRadius: "var(--radius-sm)",
        color: "var(--text-primary)", fontSize: 14, fontWeight: 600, fontFamily: "inherit",
        cursor: "pointer", flex: 1, minHeight: 48,
      };

      return html`
        <div class="fade-in" style=${{ display: "flex", flexDirection: "column", height: "100dvh" }}>
          ${/* Top bar - compact: back, title, zoom, download */null}
          <div style=${{
            background: "var(--bg-secondary)", borderBottom: "1px solid var(--border)",
            padding: "10px 14px", display: "flex", alignItems: "center", gap: 10,
          }}>
            <button onClick=${onBack} class="back-btn" style=${{ flexShrink: 0, minWidth: 40, minHeight: 40, display: "flex", alignItems: "center", justifyContent: "center" }}><${Icons.ChevronLeft} /></button>
            <span style=${{ fontSize: 13, fontWeight: 600, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${doc.nome}</span>
            <div style=${{ display: "flex", gap: 6, alignItems: "center", flexShrink: 0 }}>
              <button onClick=${zoomOut} style=${btnSmall}><${Icons.Minus} /></button>
              <button onClick=${zoomFit} style=${btnSmall}><${Icons.Maximize} /></button>
              <button onClick=${zoomIn} style=${btnSmall}><${Icons.Plus} /></button>
              <a href=${doc.arquivo} download style=${{
                ...btnSmall, background: doc.cor, color: "#fff", border: "none", textDecoration: "none",
              }}><${Icons.Download} /></a>
            </div>
          </div>

          ${/* Rotate hint - only shows in portrait on mobile */null}
          <div class="pdf-rotate-hint" style=${{
            background: "linear-gradient(135deg, var(--accent-indigo), var(--accent-indigo-light))", color: "#fff",
            padding: "14px 20px", fontSize: 15, fontWeight: 600, textAlign: "center",
            display: "none", alignItems: "center", justifyContent: "center", gap: 10,
          }}>
            <${Icons.Smartphone} /> Gire o celular para melhor visualizacao
          </div>

          ${/* PDF Canvas area */null}
          <div ref=${containerRef} style=${{
            flex: 1, overflow: "auto", background: "var(--bg-tertiary)",
            display: "flex", justifyContent: "center", alignItems: "flex-start",
            padding: "12px 0",
            WebkitOverflowScrolling: "touch",
          }}>
            ${loading && html`
              <div style=${{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: "var(--text-muted)", fontSize: 15 }}>
                Carregando PDF...
              </div>

            ${error && html`

          ${/* Bottom page navigation - large touch targets */null}
          <div style=${{

    }

    function Galeria({ onBack }) {
      const [fotos, setFotos] = useState(() => {
        try { return JSON.parse(localStorage.getItem("nossoap_galeria") || "[]"); } catch { return []; }
      });
      const [viewing, setViewing] = useState(null);

      useEffect(() => { localStorage.setItem("nossoap_galeria", JSON.stringify(fotos)); }, [fotos]);

      const resizeAndStore = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new window.Image();
          img.onload = () => {
            const maxW = 800;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const data = canvas.toDataURL("image/jpeg", 0.8);
            setFotos(prev => [{ id: Date.now(), data, caption: file.name.replace(/\.[^.]+$/, ""), date: new Date().toLocaleDateString("pt-BR") }, ...prev]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleUpload = (e) => {
        Array.from(e.target.files).forEach(resizeAndStore);
        e.target.value = "";
      };

      return html`
        <div class="fade-in">
          <${PageHeader} title="Galeria" onBack=${onBack} />
          <div class="page-container">
            <div style=${{
              background: "var(--bg-tertiary)", border: "1px solid var(--border)",

                    </div>
                    <div style=${{ padding: "8px 10px" }}>
                      <input type="text" value=${foto.caption} onChange=${e => setFotos(fotos.map(f => f.id === foto.id ? { ...f, caption: e.target.value } : f))}

            ${viewing && html`
              <div style=${{
                position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
                background: "rgba(0,0,0,0.9)", zIndex: 1000,
                display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
              }} onClick=${() => setViewing(null)}>
                <button onClick=${() => setViewing(null)} style=${{
                  position: "absolute", top: 14, right: 14,
                  background: "rgba(255,255,255,0.15)", border: "none",
                  borderRadius: 8, padding: 8, cursor: "pointer", color: "#fff", display: "flex",
                }}><${Icons.X} /></button>
                <img src=${viewing.data} alt=${viewing.caption} style=${{
                  maxWidth: "100%", maxHeight: "90vh", objectFit: "contain", borderRadius: "var(--radius)",
                }} onClick=${e => e.stopPropagation()} />
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ========================
    // APP PRINCIPAL
    // ========================
    function App() {
      const [loggedIn, setLoggedIn] = useState(() =>
        sessionStorage.getItem("nossoap_auth") === "1" || localStorage.getItem("nossoap_auth_persist") === "1"
      );
      const [page, setPage] = useState("home");
      const [theme, setTheme] = useState(() => localStorage.getItem("nossoap_theme") || "dark");
      const [decisao, setDecisao] = useState(() => localStorage.getItem("nossoap_decisao") || "ambos");
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [showSearch, setShowSearch] = useState(false);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("nossoap_theme", theme);
      }, [theme]);

      useEffect(() => { localStorage.setItem("nossoap_decisao", decisao); }, [decisao]);

      // Service worker registration
      useEffect(() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        }
      }, []);

      // Show onboarding on first login
      useEffect(() => {
        if (loggedIn && !localStorage.getItem("nossoap_onboarding_done")) {
          setShowOnboarding(true);
        }
      }, [loggedIn]);

      const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");
      const handleLogout = () => { sessionStorage.removeItem("nossoap_auth"); localStorage.removeItem("nossoap_auth_persist"); setLoggedIn(false); };
      const goHome = () => setPage("home");

      if (!loggedIn) return html`<${LoginScreen} onLogin=${() => setLoggedIn(true)} />`;

      const renderPage = () => {
        switch (page) {
          case "home": return html`<${HomeScreen} setPage=${setPage} decisao=${decisao} setDecisao=${setDecisao} theme=${theme} toggleTheme=${toggleTheme} onLogout=${handleLogout} onSearch=${() => setShowSearch(true)} />`;
          case "projecao": return html`<${Projecao} onBack=${goHome} />`;
          case "cronograma": return html`<${Cronograma} onBack=${goHome} />`;
          case "comparativo": return html`<${Comparativo} onBack=${goHome} />`;
          case "galeria": return html`<${Galeria} onBack=${goHome} />`;
          case "docs": return html`<${Documentos} onBack=${goHome} />`;
          case "anotacoes": return html`<${Anotacoes} onBack=${goHome} />`;
          case "faq": return html`<${FAQ} onBack=${goHome} />`;
          default: return html`<${HomeScreen} setPage=${setPage} decisao=${decisao} setDecisao=${setDecisao} theme=${theme} toggleTheme=${toggleTheme} onLogout=${handleLogout} onSearch=${() => setShowSearch(true)} />`;
        }
      };

      return html`
        <div style=${{ minHeight: "100vh", background: "var(--bg-primary)" }}>
          ${showOnboarding && html`<${Onboarding} onDone=${() => setShowOnboarding(false)} />`}
          ${showSearch && html`<${QuickSearch} onClose=${() => setShowSearch(false)} setPage=${setPage} />`}
          <main>${renderPage()}</main>
          <${BottomNav} page=${page} setPage=${setPage} />
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById("root"));
  </script>
</body>
</html>
